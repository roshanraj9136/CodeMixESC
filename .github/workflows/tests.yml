name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Base code and ESConv
        run: python scripts/setup_data.py
      - name: Unit tests (no API key, no model downloads)
        run: python -m pytest -q
      - name: Whole experiment plan with stand-ins
        run: python scripts/run_all.py --dry_run
